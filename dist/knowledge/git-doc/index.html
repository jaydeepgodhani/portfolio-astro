<pre class="astro-code astro-code-themes catppuccin-latte dark-plus" style="--shiki-light:#4c4f69;--shiki-dark:#D4D4D4;--shiki-light-bg:#eff1f5;--shiki-dark-bg:#1E1E1E; overflow-x: auto;" tabindex="0" data-language="plaintext"><code><span class="line"><span>git config --global user.name "xyz"</span></span>
<span class="line"><span>git config --global user.email "xyz"</span></span>
<span class="line"><span>git config --global core.editor "mate -w"</span></span>
<span class="line"><span>git config --global alias.ci commit</span></span>
<span class="line"><span>git config --global -e</span></span></code></pre>
<p>creates folder demo, inside it .git created
<code>git init demo</code></p>
<p>if new files are not added then it’ll be shown as red
<code>git status</code></p>
<p>git add filename.extention</p>
<p>now after adding that file/ all file name’ll be in green, it means it is in staging area
<code>git status</code></p>
<p>add comment
<code>git commit -m "comment you want to add"</code></p>
<p>means initialize current dir as git repo
<code>git init .</code></p>
<p>add all untracked file
<code>git add .</code></p>
<p>opens up git text editor to add comments manually
<code>git commit</code></p>
<p>commit history
<code>git log</code></p>
<p>commit history with details, to exit press Q
<code>git show</code></p>
<p>shows the tracked filed
<code>git ls-files</code></p>
<p>without adding to staging area ,commit directly with message, this command only works with already tracked files, means no new file/folder should be there
<code>git commit -am "message"</code></p>
<p>filename should be the one that we need to be unstagged file changes again appear as RED in STATUS  this command just unstage the changes in file
<code>git reset HEAD filename</code></p>
<p>file content restores back to previously known stage nothing to commit in STATUS
<code>git checkout -- filename</code></p>
<p>can be any word in place of ‘log’
<code>git help log</code></p>
<p>consize view of commits
<code>git log --oneline --graph --decorate --all</code></p>
<p>list down all the variables used as global user like username email core editor etc
<code>git config --global --list</code></p>
<p>that command is now changed to xyz
<code>git config --global alias.xyz "git command without git keyword"</code></p>
<p>rename filename , need to commit this renamed file
<code>git mv filename filename2</code></p>
<p>delete file from HDD, need commit afterwards
<code>git rm filename</code></p>
<p>just stage the deletion changes in repo
<code>git add -u</code></p>
<p>track exact changes as renameing/deletion and add to staging area
<code>git add -A</code></p>
<p>add .gitignore file to exclude the files being commited/added</p>
<p>shows the diff bw last change and HEAD pointer
<code>git diff</code></p>
<p>shows the diff bw last change and HEAD in difference tool if set
<code>git difftool</code></p>
<p>diff bw two commits, or can be one commit and HEAD pointer, diff command also works on Branches too
<code>git diff 23fg5y6 134r6ui8</code></p>
<p>*** 3 types of merge > Fast Forward - all updates are on branch nothing on master > Simple - git auto resolves conflict > Conflict - git put you in conflict state (if same line is different on both the branches then it cause conflict while merging)</p>
<p>for that you have to on Parent branch only, otherwise wont work
<code>git merge branch_name</code></p>
<p>opens up the merge tool if set, and leaves behind .orig file (that orig file must be excluded by updating .gitignore file)
<code>git mergetool</code></p>
<p>*** TAGs are useful for noting down major milestone</p>
<p>gives a lightweight tag to the given branch head
<code>git tag mytag branchname</code></p>
<p>gives a lightweight tag to the current pointer
<code>git tag mytag</code></p>
<p>list out all the tags
<code>git tag --list</code></p>
<p>obvious
<code>git tag -d mytag</code></p>
<p>list tag that has v1.5 string init
<code>git tag -l "v1.5"</code></p>
<p>delet tag in online repo
<code>git push origin --delete tagname</code></p>
<p>all information regrading tags
<code>git show mytag</code></p>
<p>update the tag, moving tag to particular commit id0
<code>git tag -f tagname 3e4r532</code></p>
<p>Defines Annotated tag, optionally with given commit id
<code>git tag -a mytag2 -m "any message that defines your tag" (commit number)</code></p>
<p>pushes the specific tags as define in origin
<code>git push origin tagname</code></p>
<p>push all tags to remote
<code>git push origin --tags</code></p>
<p>checkout in detached head mode
<code>git checkout v2.2</code></p>
<h3 id="what-if-we-want-to-work-on-some-other-thing-and-save-our-current-work-somewhere"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#what-if-we-want-to-work-on-some-other-thing-and-save-our-current-work-somewhere">What if we want to work on some other thing and Save our current work somewhere</a></h3>
<p>points head to the last commit and current work went to stash{0}
<code>git stash</code></p>
<p>list down all the stash
<code>git stash list</code></p>
<p>deletes the stash entry if not conflicting with last commit and apply past stash changes to staging area
<code>git stash pop</code></p>
<h3 id="time-travel-with-reset-and-reflog-rollback-to-past-commit"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#time-travel-with-reset-and-reflog-rollback-to-past-commit">time travel with reset and reflog, rollback to past commit</a></h3>
<p>change the head to ce2c810 with preserving Staging and Current work(red)
<code>git reset ce2c810 --soft</code></p>
<p>default mode of reset, clears the staging area and moves all changes to current work
<code>git reset 6ad74df --mixed</code></p>
<p>most destructing mode, any changes wiped out, staging(green) + current
<code>git reset d54r654 --hard</code></p>
<p>all diff actions taken in project
<code>git reflog</code></p>
<h3 id="push"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#push">push</a></h3>
<p>checks for the remote connection if any
<code>git remote -v</code></p>
<p>creates remote connection as ‘origin’
git remote add origin <a href="https://github.com/username/repo.git">https://github.com/username/repo.git</a></p>
<p>option u is for tracking in future, future push doesnt require u option, origin is previously define remote conn, it could be anything you’ve set
<code>git push -u origin master --tags</code></p>
<p>with : you can delete branch remotely
<code>git push origin :branch_name</code></p>
<h3 id="fetchpull-is-the-best-practise-before-pushing-anything-to-remote-repo"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#fetchpull-is-the-best-practise-before-pushing-anything-to-remote-repo">fetch/pull is the best practise before pushing anything to remote repo</a></h3>
<p>just fetch the new updates but dont merge it
<code>git fetch</code></p>
<p>Prune option looks for dead branch remotely and delete reference from your local repo
<code>git fetch -p</code></p>
<p>combination of fetch and merge, current branch only
<code>git pull</code></p>
<p>pull all branches to the locally
<code>hit pull --all</code></p>
<p>merge onnline repo to your local repo to the point where they match and after that it applies your latest changes to locally, after this command you are ahead of online repo
<code>git pull --rebase</code></p>
<p>removes from HDD and also git tracking
<code>git rm readme.md</code></p>
<p>removes from git tracking only not from HDD
<code>git rm --cached readme.md</code></p>
<p>rename and add to stage readme.md as readme
<code>git mv readme.md readme</code></p>
<p>edits the previous commit and add new/modified files with new message, as if previous commit never happened
<code>git commit --amend</code></p>
<p>suppose you staged two files, and wanted to unstage one of the file, Unstaging a Staged File</p>
<pre class="astro-code astro-code-themes catppuccin-latte dark-plus" style="--shiki-light:#4c4f69;--shiki-dark:#D4D4D4;--shiki-light-bg:#eff1f5;--shiki-dark-bg:#1E1E1E; overflow-x: auto;" tabindex="0" data-language="plaintext"><code><span class="line"><span>git reset HEAD CONTRIBUTING.md /</span></span>
<span class="line"><span>git restore --staged CONTRIBUTING.md</span></span></code></pre>
<p>undone the last changes made, reset it to last commited stage, file change happens locally BEWARE</p>
<pre class="astro-code astro-code-themes catppuccin-latte dark-plus" style="--shiki-light:#4c4f69;--shiki-dark:#D4D4D4;--shiki-light-bg:#eff1f5;--shiki-dark-bg:#1E1E1E; overflow-x: auto;" tabindex="0" data-language="plaintext"><code><span class="line"><span>git checkout -- CONTRIBUTING.md /</span></span>
<span class="line"><span>git restore CONTRIBUTING.md</span></span></code></pre>
<p>shows you the URLs that Git has stored for the shortname to be used when reading and writing to that remote (origin — that is the default name Git gives to the server you cloned from)
<code>git remote -v</code></p>
<p>adds the pb remote, see below output</p>
<pre class="astro-code astro-code-themes catppuccin-latte dark-plus" style="--shiki-light:#4c4f69;--shiki-dark:#D4D4D4;--shiki-light-bg:#eff1f5;--shiki-dark-bg:#1E1E1E; overflow-x: auto;" tabindex="0" data-language="plaintext"><code><span class="line"><span>git remote add pb https://github.com/paulboone/ticgit</span></span>
<span class="line"><span>$ git remote -v</span></span>
<span class="line"><span>origin https://github.com/schacon/ticgit (fetch)</span></span>
<span class="line"><span>origin https://github.com/schacon/ticgit (push)</span></span>
<span class="line"><span>pb https://github.com/paulboone/ticgit (fetch)</span></span>
<span class="line"><span>pb https://github.com/paulboone/ticgit (push)</span></span></code></pre>
<p>Now you can use the string pb on the command line in lieu of the whole URL. For example, if you want to fetch all the information that Paul has but that you don’t yet have in your repository, you can run git fetch pb</p>
<h3 id="when-creating-new-branch-all-the-changes-that-are-on-parentmaster-branch-are-carry-forwarded-to-the-new-branch"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#when-creating-new-branch-all-the-changes-that-are-on-parentmaster-branch-are-carry-forwarded-to-the-new-branch">When creating new branch, all the changes that are on parent(master) branch are carry forwarded to the new branch.</a></h3>
<p>creates new branch and also points to it
<code>git checkout -b branch_name</code></p>
<p>shows all branches and which one are you currently on
<code>git branch</code></p>
<p>delete branch, for that you have to on diff branch than that you’re deleting
<code>git branch -d branch_name</code></p>
<p>create new testing branch from current checkedout branch
<code>git branch testing</code></p>
<p>shows head and all other pointer to commit number
<code>git log --oneline --decorate --graph --all</code>
f30ab (HEAD -> master, testing) Add feature #32 - ability to add new formats to the central interface</p>
<p>Create a new branch and switch to it
<code>git switch -c newBranch</code></p>
<p>Switch to an existing branch
<code>git switch newBranch</code></p>
<p>Return to your previously checked out branch
<code>git switch -</code></p>
<p>merge hotFix branch into current checked out branch - when you try to merge one commit with a commit that can be reached by following the first commit’s history, Git simplifies things by moving the pointer forward because there is no divergent work to merge together — this is called a “fast- forward (changes are only onne commit ahead then it’s called fast-forward)
<code>git merge hotFix</code></p>
<p>To see the last commit on each branch
<code>git branch -v</code></p>
<p>To see which branches are already merged into the branch you’re on
<code>git branch --merged</code></p>
<p>To see all the branches that contain work you haven’t yet merged in
<code>git branch --no-merged (branchName)</code></p>
<p>locally change the branch name
<code>git branch --move bad-branch-name corrected-branch-name</code></p>
<p>push changed branch name to remote server
<code>git push --set-upstream origin corrected-branch-name</code></p>
<p>delete old branch name from remote server
<code>git push origin --delete bad-branch-name</code></p>
<p>fetchs the data from remote and apply it to local and set current remote/master pointer to latest position same as master at remote’s.
<code>git fetch (remote)</code></p>
<p>push local serverfix branch to remote serverfix branch
<code>git push origin serverfix:serverfix</code></p>
<p>push local serverfix branch to remote awesomebranch branch
the branch it tracks is called an “upstream branch”
<code>git push origin serverfix:awesomebranch</code></p>
<p>If the branch name you’re trying to checkout (a) doesn’t exist and (b) exactly matches a name on only one remote, Git will create a tracking branch for you
create serverfix branch on local from remote/serverfix you just pulled from server
<code>git checkout serverfix (executing this after latest pull operation)</code></p>
<p>To set up a local branch with a different name than the remote branch, you can easily use the first version with a different local branch name
<code>git checkout -b sf origin/serverfix</code></p>
<p>If you already have a local branch and want to set it to a remote branch you just pulled down, or want to change the upstream branch you’re tracking, -u means upstream
<code>git branch -u origin/serverfix</code></p>
<p>If you want to see what tracking branches you have set up, you can use the -vv option to git branch. This will list out your local branches with more information including what each branch is tracking and if your local branch is ahead, behind or both, but this maybe not up to date, to see up to date details run  git fetch —all  first then  git branch -vv
<code>git branch -vv</code></p>
<p>git pull = git fetch + git merge</p>
<p>deletes serverfix branch from remote
<code>git push origin --delete serverfix</code></p>
<p>git checkout experiment
git rebase master
add all the commits on top of the master’s latest commit, after than you have to merge it
git checkout master
git merge experiement</p>
<p>if you’re on different branch then git rebase (basebranch) (topicbranch), it takes all the changes from the server and apply it to master, then you have to merge in master later
<code>git rebase master server</code></p>
<p>never rebase anything that you’ve pushed somewhere ever</p>
