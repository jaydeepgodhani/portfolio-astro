<h2 id="debounce"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#debounce">Debounce</a></h2>
<p>examples to use debounce -> events such as <code>mousemove</code> or <code>window.resize</code> can trigger hundreds of calls</p>
<p>In Debouncing, if multiple calls to the callback occur within the defined time window, only the last call will be considered for execution and the previous ones will be discarded. Additionally, while this is happening, the time window will also be renewed each time a call occurs. For example, if we define the time as 2 seconds, the callback defined in the <code>debounce</code> function will only be executed after 2 seconds. If multiple calls occur within the time window, the time will be renewed for the same period, and only the last function that entered the <code>debounce</code> function will be executed once the defined time is met.</p>

<h2 id="virtualisation-windowing"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#virtualisation-windowing">Virtualisation (Windowing)</a></h2>
<p>This technique is especially useful for components that display large amounts of data, such as tables. By only rendering the rows and columns that are currently visible, or when we scroll to big list, only visible portion is rendered and below all data is not rendered for smoother experience</p>
<h2 id="error-boundaries"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#error-boundaries">Error Boundaries</a></h2>
<p>Error boundaries are React components that catch JavaScript errors anywhere in their child component tree, log those errors, and display a fallback UI instead of the component tree that crashed. <a href="https://react.dev/reference/react/Component#catching-rendering-errors-with-an-error-boundary">Error boundaries</a> catch errors during rendering, lifecycle methods, and constructors of the whole tree below them. It’s important to note that error boundaries do not catch errors for event handlers, asynchronous code, or errors that occur in the error boundary itself. You can find more details about error boundaries <a href="https://reactjs.org/docs/error-boundaries.html">here</a>.</p>

<h2 id="inline-functions"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#inline-functions">Inline Functions</a></h2>
<p>Avoid inline function. why ?</p>
<ol>
<li><strong>Performance</strong>: Every time a component is rendered in React, all inline functions are recreated. This can lead to slower performance in your application, especially if you have many components with inline functions.</li>
<li><strong>Maintenance</strong>: Inline functions are defined within the component and cannot be reused in other parts of the application. This can make the code more difficult to maintain as the application grows.</li>
<li><strong>Readability</strong>: Inline functions can make code more difficult to read and understand, especially if they are long or have many arguments.</li>
</ol>

<h2 id="tdz-temporal-dead-zone"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#tdz-temporal-dead-zone">TDZ Temporal Dead Zone</a></h2>
<p>The Temporal Dead Zone(TDZ) is a specific period or area of a block where a variable is inaccessible until it has been intialized with a value. This behavior in JavaScript that occurs when declaring a variable with the let and const keywords, but not with var. In ECMAScript 6, accessing a <code>let</code> or <code>const</code> variable before its declaration (within its scope) causes a ReferenceError.</p>

<h2 id="event-loop"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#event-loop">Event Loop</a></h2>
<p>Event loop checks if the main stack is empty and moves code from side stack(all async code) to main stack for execution.
The event loop is a process that continuously monitors both the call stack and the event queue and checks whether or not the call stack is empty. If the call stack is empty and there are pending events in the event queue, the event loop dequeues the event from the event queue and pushes it to the call stack. The call stack executes the event, and any additional events generated during the execution are added to the end of the event queue.</p>
<p><strong>Note:</strong> The event loop allows Node.js to perform non-blocking I/O operations, even though JavaScript is single-threaded, by offloading operations to the system kernel whenever possible. Since most modern kernels are multi-threaded, they can handle multiple operations executing in the background.</p>

<h2 id="service-worker"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#service-worker">Service Worker</a></h2>
<p>A Service worker is basically a script (JavaScript file) that runs in the background, separate from a web page and provides features that don’t need a web page or user interaction. Some of the major features of service workers are Rich offline experiences(offline first web application development), periodic background syncs, push notifications, intercept and handle network requests and programmatically managing a cache of responses.
Service worker can’t access the DOM directly. But it can communicate with the pages it controls by responding to messages sent via the <code>postMessage</code> interface, and those pages can manipulate the DOM</p>

<h2 id="global-variable"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#global-variable">Global Variable</a></h2>
<p>Global variables are those that are available throughout the length of the code without any scope. The var keyword is used to declare a local variable but if you omit it then it will become global variable. The problem with global variables is the conflict of variable names of local and global scope. It is also difficult to debug and test the code that relies on global variables.
<code>msg = "Hello"; // var is missing, it becomes global variable</code></p>

<li>both the same object (means both object have same reference)</li>
<li>both numbers and both +0 both -0 both NaN both non-zero and both not NaN and both have the same value.</li>
</ol>

<h2 id="what-are-the-differences-between-weakset-and-set"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#what-are-the-differences-between-weakset-and-set">What are the differences between WeakSet and Set</a></h2>
<p>The main difference is that references to objects in Set are strong while references to objects in WeakSet are weak. i.e, An object in WeakSet can be garbage collected if there is no other reference to it. Other differences are,</p>
<ol>
<li>Sets can store any value Whereas WeakSets can store only collections of objects</li>
<li>WeakSet does not have size property unlike Set</li>
<li>WeakSet does not have methods such as clear, keys, values, entries, forEach.</li>
<li>WeakSet is not iterable.</li>
</ol>

<h2 id="event-loop-1"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#event-loop-1">event loop</a></h2>
<p><a href="https://github.com/sudheerj/javascript-interview-questions?tab=readme-ov-file#what-is-an-event-loop"></a>The event loop is a process that continuously monitors both the call stack and the event queue and checks whether or not the call stack is empty. If the call stack is empty and there are pending events in the event queue, the event loop dequeues the event from the event queue and pushes it to the call stack. The call stack executes the event, and any additional events generated during the execution are added to the end of the event queue.</p>
<h2 id="event-queue"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#event-queue">event queue</a></h2>
<p><a href="https://github.com/sudheerj/javascript-interview-questions?tab=readme-ov-file#what-is-an-event-queue"></a>The event queue follows the queue data structure. It stores async callbacks to be added to the call stack. It is also known as the Callback Queue or Macrotask Queue.</p>
<p>Whenever the call stack receives an async function, it is moved into the Web API. Based on the function, Web API executes it and awaits the result. Once it is finished, it moves the callback into the event queue (the callback of the promise is moved into the microtask queue).</p>
<p>The event loop constantly checks whether or not the call stack is empty. Once the call stack is empty and there is a callback in the event queue, the event loop moves the callback into the call stack. But if there is a callback in the microtask queue as well, it is moved first. The microtask queue has a higher priority than the event queue.</p>

<h2 id="what-are-the-attributes-provided-by-a-property-descriptor"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#what-are-the-attributes-provided-by-a-property-descriptor">What are the attributes provided by a property descriptor</a></h2>
<p>A property descriptor is a record which has the following attributes</p>
<ol>
<li>value: The value associated with the property</li>
<li>writable: Determines whether the value associated with the property can be changed or not</li>
<li>configurable: Returns true if the type of this property descriptor can be changed and if the property can be deleted from the corresponding object.</li>
<li>enumerable: Determines whether the property appears during enumeration of the properties on the corresponding object or not.</li>
<li>set: A function which serves as a setter for the property</li>
<li>get: A function which serves as a getter for the property</li>
</ol>

<p>Whereas in the second loop, the variable i is declared as the <code>let</code> keyword it becomes a block scoped variable and it holds a new value(0, 1 ,2 3) for each iteration. Hence, the output of the first loop is <code>0 1 2 3</code>.</p>

<h2 id="what-are-the-differences-between-spread-operator-and-rest-parameter"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#what-are-the-differences-between-spread-operator-and-rest-parameter">What are the differences between spread operator and rest parameter</a></h2>

<h2 id="what-is-the-difference-between-settimeout-setimmediate-and-processnexttick"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#what-is-the-difference-between-settimeout-setimmediate-and-processnexttick">What is the difference between setTimeout, setImmediate and process.nextTick?</a></h2>
<ol>
<li><strong>Set Timeout:</strong> setTimeout() is to schedule execution of a one-time callback after delay milliseconds.</li>
<li><strong>Set Immediate:</strong> The setImmediate function is used to execute a function right after the current event loop finishes.</li>
<li><strong>Process NextTick:</strong> If process.nextTick() is called in a given phase, all the callbacks passed to process.nextTick() will be resolved before the event loop continues. This will block the event loop and create I/O Starvation if process.nextTick() is called recursively.</li>
</ol>

<h2 id="optional-chaining"><a class="anchor-link" aria-hidden="" tabindex="-1" style="text-decoration: none; font-style: normal;" href="#optional-chaining">Optional Chaining</a></h2>
<p>According to MDN official docs, the optional chaining operator (?.) permits reading the value of a property located deep within a chain of connected objects without having to expressly validate that each reference in the chain is valid.</p>
<p>The ?. operator is like the . chaining operator, except that instead of causing an error if a reference is nullish (null or undefined), the expression short-circuits with a return value of undefined. When used with function calls, it returns undefined if the given function does not exist.</p>

<ul>
<li>The <code>this</code> keyword in JavaScript is a special variable that is used within a function to refer to the object on which the function is invoked. The value of this depends on how the function is called. It allows functions to access and interact with the object they are bound to.</li>
