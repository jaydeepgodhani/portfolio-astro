          doc.classList.add("dark");
        } else {
          doc.classList.remove("dark");
        }
        localStorage.setItem("theme", theme);
      };

      // Set initial theme immediately to prevent flash
      setTheme(getTheme());

nt.Fd5LK8aS.js" props="{}" ssr client="only" opts="{&quot;name&quot;:&quot;FramerDiv&quot;,&quot;value&quot;:true}" await-children><template data-astro-template>  <div> <article class="wrapper transition-opacity duration-300 opacity-100 animate-fade"> <div class="flex items-center justify-between"> <h1>Docker Doc</h1> </div> <hr class="text-secondary border"> <br> <br> <p>Cheatsheet - <a href="https://dockerlabs.collabnix.com/docker/cheatsheet/">https://dockerlabs.collabnix.com/docker/cheatsheet/</a></p>
<blockquote>
<p>creates the container and exit
<code>docker create ngnix</code></p>
</blockquote>
<blockquote>
<p>starts the docker container
<code>docker start &#x3C;container_id/name</code></p>
</blockquote>
<blockquote>
<p>ctrl+c wont stop process inside container but just exit the container only
<code>docker attach --sig-proxy=false &#x3C;container_id</code></p>
</blockquote>
<blockquote>
<p>this is create+run >> run local image and exited if found, otherwise pull it from hub
<code>docker run ngnix</code></p>
</blockquote>
<blockquote>
<p>create + run + attach + delete when process is done
<code>docker run -it --rm imagename</code></p>
</blockquote>
<blockquote>
<p>running container list
<code>docker ps</code></p>
</blockquote>
<blockquote>
<p>all container
<code>docker ps -a</code></p>
</blockquote>
<blockquote>
<p>stop docker container
<code>docker stop container_name</code></p>
</blockquote>
<blockquote>
<p>remove stopped container
<code>docker rm container_name</code></p>
</blockquote>
<blockquote>
<p>list all images
<code>docker images</code></p>
</blockquote>
<blockquote>
<p>must remove all running container before removing image
delete an image
<code>docker rmi ngnix</code></p>
</blockquote>
<blockquote>
<p>only pulls image (not run)
<code>docker pull ngnix</code></p>
</blockquote>
<blockquote>
<p>run container in detach mode AND sleep for 20 second
<code>docker run -d ngnix sleep 20</code></p>
</blockquote>
<blockquote>
<p>attach container in CMD
<code>docker attach docker_id</code></p>
</blockquote>
<blockquote>
<p>Why -it ?
if you want to provide input to the application then -i is necessary, like what is your name etc etc, and whatever you want to see from terminal of container you have to attach container’s terminal to host’s terminal that’s why -t
iterative mode and run bash as first command
<code>docker run -it ngnix bash</code></p>
</blockquote>
<blockquote>
<p>run BASH command on container 34egr, you can run any command as you like for ex cat /etc/<em>release</em>
<code>docker exec 34egr34h34 bash</code></p>
</blockquote>
<blockquote>
<p>this is called TAG, specify which version you want to use
<code>docker run redis:4.0</code></p>
</blockquote>
<blockquote>
<p>Docker Host in your system has one IP allocated to it, and each container that run within it has different port mapped to it, so if you want to run diff instance of webapp on a single host then you have to map like this
(when you first run webapp on host, it shows which port it runs on, for below example webapp runs on 5000 and mysql runs on 3306)</p>
</blockquote>
<pre class="astro-code astro-code-themes catppuccin-latte dark-plus" style="--shiki-light:#4c4f69;--shiki-dark:#D4D4D4;--shiki-light-bg:#eff1f5;--shiki-dark-bg:#1E1E1E; overflow-x: auto;" tabindex="0" data-language="plaintext"><code><span class="line"><span>docker run -p 80:5000 jaydeep/webapp</span></span>
<span class="line"><span>docker run -p 8000:5000 jaydeep/webapp</span></span>
<span class="line"><span>docker run -p 8020:5000 jaydeep/webapp</span></span>
<span class="line"><span>docker run -p 9000:3306 mysql</span></span>
<span class="line"><span>docker run -p 9030:3306 mysql</span></span></code></pre>
<p>(so here 3 instance of webapp and 2 instance of mysql runs on Host)</p>
<blockquote>
<p>all the details(internal ip,port) of container
<code>docker inspect container_id/name</code></p>
</blockquote>
<blockquote>
<p>display logs(standard out) when container runs in detach mode
<code>docker logs container_id/name</code></p>
</blockquote>
<blockquote>
<p>by default mysql stores its data in /var/lib/mysql, when container stops and remove its data also losts, so to persist the data written into container, we have to map external volume(host’s volume) to the data volume that container uses
<code>docker run -v /opt/mydatadir:/var/lib/mysql mysql</code></p>
</blockquote>
<blockquote>
<p>give it a particular name
<code>docker run -d --name=redis redis</code></p>
</blockquote>
<blockquote>
<p>How to build image
Dockerfile >>default name of the file which contains instructions, for ex</p>
</blockquote>
<pre class="astro-code astro-code-themes catppuccin-latte dark-plus" style="--shiki-light:#4c4f69;--shiki-dark:#D4D4D4;--shiki-light-bg:#eff1f5;--shiki-dark-bg:#1E1E1E; overflow-x: auto;" tabindex="0" data-language="plaintext"><code><span class="line"><span>FROM Ubuntu</span></span>
<span class="line"><span>run apt-get update &#x26;&#x26; apt-get -y install python</span></span>
<span class="line"><span>RUN pip install flask flask-mysql</span></span>
<span class="line"><span>COPY . /opt/code</span></span>
<span class="line"><span>ENTRYPOINT FLASK_APP=/opt/code/app.py flask run</span></span></code></pre>
<blockquote>
<p>-t is for tag name we give
<code>docker build Dockerfile -t jaydeep/my-custom-app</code></p>
</blockquote>
<blockquote>
<p>docker host creates custom volume “data_volume” under /var/lib/docker
<code>docker volume create data_volume</code></p>
</blockquote>
<blockquote>
<p>now container’s volume is mapped to our data_volume which is persistent, this alone command can also be used as docker host will automatically mount new volume as you specify name
<code>docker run -v data_volume:/var/lib/mysql mysql</code></p>
</blockquote>
<blockquote>
<p>image info that when it was created and size etc
<code>docker history image_id</code></p>
</blockquote>
<blockquote>
<p>build using current folder’s dockerfile
<code>docker build .</code></p>
</blockquote>
<blockquote>
<p>gives a name to the untagged previously build image
<code>docker build . -t mywebapp</code>
<code>docker build . -f dockerfilecustom -t mytag</code> -f is filename</p>
</blockquote>
<blockquote>
<p>total size used by images, container and volumes
<code>docker system df</code></p>
</blockquote>
<blockquote>
<p>versbose, particular size used by Images
<code>docker system df -v</code></p>
</blockquote>
<blockquote>
<p>by this command only single instance of app can use host’s port, thus no need to bind it s explicitely, and can run multiple apps using diff ports obviously, by default BRIDGE network is used, others are HOST and NONE
<code>docker run ubuntu --network=host</code></p>
</blockquote> </article> <div> <ul>  </ul> </div> </div>  <footer class="pt-6 animate-fade"> <div class="flex justify-center mt-16 text-primary text-2xl"> <a class="mx-3 text-primary" href="mailto:jaydeepgodhani16@gmail.com" target="_blank" rel="noopener noreferrer" aria-label="email to Jaydeep">  <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 24 24" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"> <path d="M15.61 12c0 1.99-1.62 3.61-3.61 3.61-1.99 0-3.61-1.62-3.61-3.61 0-1.99 1.62-3.61 3.61-3.61 1.99 0 3.61 1.62 3.61 3.61M12 0C5.383 0 0 5.383 0 12s5.383 12 12 12c2.424 0 4.761-.722 6.76-2.087l.034-.024-1.617-1.879-.027.017A9.494 9.494 0 0 1 12 21.54c-5.26 0-9.54-4.28-9.54-9.54 0-5.26 4.28-9.54 9.54-9.54 5.26 0 9.54 4.28 9.54 9.54a9.63 9.63 0 0 1-.225 2.05c-.301 1.239-1.169 1.618-1.82 1.568-.654-.053-1.42-.52-1.426-1.661V12A6.076 6.076 0 0 0 12 5.93 6.076 6.076 0 0 0 5.93 12 6.076 6.076 0 0 0 12 18.07a6.02 6.02 0 0 0 4.3-1.792 3.9 3.9 0 0 0 3.32 1.805c.874 0 1.74-.292 2.437-.821.719-.547 1.256-1.336 1.553-2.285.047-.154.135-.504.135-.507l.002-.013c.175-.76.253-1.52.253-2.457 0-6.617-5.383-12-12-12"></path> </svg>  </a> <a class="mx-3 text-primary" href="https://www.linkedin.com/in/jaydeepgodhani" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn for Jaydeep">  <svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 448 512" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"> <path d="M100.28 448H7.4V148.9h92.88zM53.79 108.1C24.09 108.1 0 83.5 0 53.8a53.79 53.79 0 0 1 107.58 0c0 29.7-24.1 54.3-53.79 54.3zM447.9 448h-92.68V302.4c0-34.7-.7-79.2-48.29-79.2-48.29 0-55.69 37.7-55.69 76.7V448h-92.78V148.9h89.08v40.8h1.3c12.4-23.5 42.69-48.3 87.88-48.3 94 0 111.28 61.9 111.28 142.3V448z"></path> </svg>  </a> <a class="mx-3 text-primary" href="https://www.github.com/in/jaydeepgodhani" target="_blank" rel="noopener noreferrer" aria-label="Jaydeep's Github">  <svg stroke="currentColor" fill="cu
